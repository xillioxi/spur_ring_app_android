// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Keep generated native paths short enough for the Windows CMake/Ninja toolchain.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
  def configuredCxxRoot = System.getenv('ANDROID_CXX_STAGING_ROOT')
  def cxxRoot = configuredCxxRoot
    ? new File(configuredCxxRoot)
    : rootProject.file("../../../../.android-cxx")
  subprojects { libraryProject ->
    libraryProject.plugins.withId('com.android.library') {
      def shortName = libraryProject.name.replace('react-native-', 'rn-')
      libraryProject.android.externalNativeBuild.cmake.buildStagingDirectory =
        new File(cxxRoot, shortName)
    }
  }
}
