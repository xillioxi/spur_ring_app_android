<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Agent</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f6f7f8;
        color: #202124;
      }

      body {
        margin: 0;
      }

      main {
        width: min(920px, calc(100vw - 32px));
        margin: 40px auto;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #5f6368;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
      }

      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      button {
        border: 1px solid #c6c9ce;
        border-radius: 6px;
        background: #ffffff;
        color: #202124;
        font: inherit;
        padding: 10px 14px;
        cursor: pointer;
      }

      button.primary {
        background: #0b57d0;
        border-color: #0b57d0;
        color: #ffffff;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      input[type="file"] {
        max-width: 100%;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 12px 0 0;
        padding: 12px;
        border-radius: 6px;
        background: #f1f3f4;
        min-height: 80px;
      }

      .status {
        font-weight: 600;
        color: #174ea6;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Audio Agent</h1>
        <p>Record audio locally, transcribe it, and send the task to the agent.</p>
      </header>

      <section class="panel">
        <div class="controls">
          <button id="start" class="primary">开始录音</button>
          <button id="stop" disabled>停止并提交</button>
        </div>
        <p id="status" class="status">等待录音</p>
      </section>

      <section class="panel">
        <h2>本地音频文件</h2>
        <div class="controls">
          <input id="audio-file" type="file" accept="audio/*" />
          <button id="upload-file">上传并提交</button>
        </div>
      </section>

      <section class="panel">
        <h2>转写文本</h2>
        <pre id="transcript"></pre>
      </section>

      <section class="panel">
        <h2>Agent 输出</h2>
        <pre id="agent-output"></pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
